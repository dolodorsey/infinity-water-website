name: Infinity Audit Lock Fix

on:
  push:
    branches:
      - enterprise/infinity-phase1-security-20260903
    paths:
      - package.json
      - .github/workflows/infinity-audit-fix.yml

permissions:
  contents: write

jobs:
  refresh-audited-lock:
    if: ${{ !contains(github.event.head_commit.message, 'refresh Infinity audited lockfile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Infinity branch
        uses: actions/checkout@v4
        with:
          ref: enterprise/infinity-phase1-security-20260903
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh locked dependency graph
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify full dependency audit
        run: npm audit --audit-level=high

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already satisfies the audited package graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh Infinity audited lockfile"
          git push origin HEAD:enterprise/infinity-phase1-security-20260903
