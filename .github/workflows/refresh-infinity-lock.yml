name: Temporary Infinity Lock Refresh

on:
  push:
    branches:
      - enterprise/infinity-connect-revenue-focus-20260909
    paths:
      - package.json
      - .github/workflows/refresh-infinity-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Infinity candidate
        uses: actions/checkout@v4
        with:
          ref: enterprise/infinity-connect-revenue-focus-20260909

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched js-yaml lock
        run: node -e "const p=require('./package-lock.json'); if(p.packages?.['node_modules/js-yaml']?.version!=='4.3.2') process.exit(1)"

      - name: Commit deterministic lock refresh
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh Infinity lockfile for js-yaml security patch'
          git push origin HEAD:enterprise/infinity-connect-revenue-focus-20260909
